[mcu_update_manager]
enabled: true
repo_path: ~/mcu-update-manager
printer_cfg: ~/printer_data/config/printer.cfg
serial_dir: /dev/serial/by-id
devices_path: devices.yaml
profile_dirs: profiles
custom_profile_dir: ~/printer_data/config/mcu_update_manager/profiles
can_interface: can0
can_bitrate: 1000000
klipper_path: ~/klipper
kalico_path: ~/kalico
katapult_path: ~/katapult
cartographer_firmware_path: ~/cartographer_firmware
build_root: builds
artifact_root: artifacts
cache_path: cache/operation.json
