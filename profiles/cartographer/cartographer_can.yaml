id: cartographer_can
name: Cartographer CAN
vendor: Cartographer
family: probe
source:
  - https://docs.cartographer3d.com/
match:
  chips:
    - stm32g431xx
  mcu_name_hints:
    - cartographer
  transports:
    - can
build:
  managed_by: cartographer_firmware
bootloader:
  managed_by: cartographer_firmware
  type: katapult_deployer
initial_flash:
  method: cartographer_vendor_script
  repository: https://github.com/Cartographer3D/cartographer_firmware.git
  script: "~/cartographer_firmware/v4_switch.sh"
  usb_to_can: true
  physical_steps:
    - Plug Cartographer V4 into USB.
    - Run v4_switch.sh from cartographer_firmware.
    - Flash Katapult deployer from the script.
    - Power off and connect the probe to CAN.
    - Flash selected CAN firmware over CAN with the generated command.
update:
  method: cartographer_prebuilt_bin
  catalog: "~/cartographer_firmware/firmware_list.csv"
  firmware_root: "~/cartographer_firmware/firmware"
  flash_can: "~/klippy-env/bin/python ~/katapult/scripts/flashtool.py -i {{ can_interface }} -f {{ artifact }} -u {{ canbus_uuid }}"
flash:
  method: cartographer_prebuilt_bin
  transport: can_katapult
notes:
  mode: Use Cartographer3D/cartographer_firmware firmware_list.csv and prebuilt .bin files; do not compile with Klipper make.
