id: custom_stm32h723_can
name: Generic STM32H723 USB-CAN Bridge Mainboard
vendor: Custom
family: mainboard
source:
  - custom
match:
  chips:
    - stm32h723xx
  transports:
    - can
build:
  requires_exact_profile: true
  firmware: klipper
  architecture: stm32
  processor: STM32H723
  clock_reference: 25MHz crystal
  bootloader_offset: 128KiB
  communication: usb_to_canbus_bridge
  usb_pins: PA11/PA12
  can_rx_pin: PD0
  can_tx_pin: PD1
  can_bitrate: "{{ can_bitrate }}"
  gpio_pins_on_startup: ""
bootloader:
  firmware: katapult
  type: katapult
  architecture: stm32
  processor: STM32H723
  clock_reference: 25MHz crystal
  bootloader_offset: 128KiB
  application_start_offset: 128KiB
  communication: usb
  usb_pins: PA11/PA12
  support_bootloader_entry: true
initial_flash:
  method: dfu_util
  bootloader: katapult
  dfu_vid_pid: "0483:df11"
  artifact: "~/katapult/out/katapult.bin"
  command: "sudo dfu-util -R -a 0 -s 0x08000000:mass-erase:force:leave -D ~/katapult/out/katapult.bin -d 0483:df11"
  fallback_command: "sudo dfu-util -R -a 0 -s 0x08000000:leave -D ~/katapult/out/katapult.bin -d 0483:df11"
  verify: "lsusb"
update:
  method: can_bridge_usb_katapult
  stop_klipper: true
  enter_bootloader_usb: "~/klippy-env/bin/python -c 'import flash_usb as u; u.enter_bootloader(\"{{ serial }}\")'"
  flash_usb: "make flash FLASH_DEVICE={{ katapult_serial }}"
  start_klipper: true
flash:
  method: can_katapult
notes:
  mode: Fallback only. Select the exact board profile before building or flashing.
  caution: Confirm the exact board profile when possible; this generic profile assumes USB PA11/PA12, CAN PD0/PD1, 25MHz crystal, and 128KiB Katapult offset.
