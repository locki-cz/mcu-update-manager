# Auto-generated from reviewed Esoterical menuconfig screenshots.
# Regenerate with tools/generate_profiles_from_extracted.py after editing esoterical-extracted-config.json.
profiles:
  - id: esoterical_bigtreetech_kraken_usb_can_bridge
    name: BigTreeTech Kraken USB-CAN bridge
    vendor: BigTreeTech
    family: mainboard
    source:
      - https://canbus.esoterical.online/mainboard_flashing/common_hardware.html
    source_images:
      - esoterical-images/001.png
      - esoterical-images/002.png
    match:
      chips:
        - stm32h723xx
      mcu_name_hints:
        - kraken
      transports:
        - usb
        - can
    build:
      firmware: klipper
      architecture: stm32
      processor: STM32H723
      clock_reference: 25MHz crystal
      bootloader_offset: 128KiB
      communication: usb_to_canbus_bridge
      usb_pins: PA11/PA12
      can_rx_pin: PD0
      can_tx_pin: PD1
      can_bitrate: "{{ can_bitrate }}"
    bootloader:
      firmware: katapult
      type: katapult
      architecture: stm32
      processor: STM32H723
      clock_reference: 25MHz crystal
      bootloader_offset: 128KiB
      communication: usb
      usb_pins: PA11/PA12
      application_start_offset: 128KiB
      support_double_click_reset: true
      status_led: true
      status_led_pin: PA14
    initial_flash:
      method: dfu_util
      bootloader: katapult
      dfu_vid_pid: "0483:df11"
      artifact: "~/katapult/out/katapult.bin"
      command: "dfu-util -R -a 0 -s 0x08000000:mass-erase:force:leave -D ~/katapult/out/katapult.bin -d 0483:df11"
      physical_steps:
        - Put the board into STM32 DFU mode.
        - Connect USB to the board.
        - Verify that 0483:df11 is visible before flashing.
    update:
      method: usb_katapult_or_make_flash
      stop_klipper: true
      enter_bootloader: "make flash FLASH_DEVICE={{ serial }}"
      flash: "make flash FLASH_DEVICE={{ serial }}"
      start_klipper: true
    flash:
      method: usb_katapult_or_make_flash
