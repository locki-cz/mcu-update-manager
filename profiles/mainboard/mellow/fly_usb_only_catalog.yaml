profiles:
  - id: mellow_fly_rrf_e3_pro_v3_usb
    name: Mellow FLY RRF E3 PRO V3 USB
    vendor: Mellow
    family: mainboard
    source:
      - https://mellow-3d.github.io/fly_rrf_e3_pro_v3_klipper_usb.html
    match:
      chips:
        - stm32f407xx
      mcu_name_hints:
        - rrf
        - e3
        - pro
      transports:
        - usb
    build:
      firmware: klipper
      architecture: stm32
      processor: STM32F407
      clock_reference: 8MHz crystal
      bootloader_offset: 32KiB
      communication: usb
      usb_pins: PA11/PA12
      requires_manual_menuconfig: true
    flash:
      method: pending_verified_profile
