id: mellow_fly_super8_pro_h723_usb_can_bridge
name: Mellow Fly-Super8 Pro H723 USB-CAN bridge
vendor: Mellow
family: mainboard
source:
  - https://mellow-3d.github.io/fly_super8_pro_h723_canboot_can.html
  - https://mellow-3d.github.io/fly_super8_pro_h723_klipper_usbtocan.html
  - https://mellow-3d.github.io/fly_super8_pro_h723_klipper_usbtocan_updating.html
match:
  chips:
    - stm32h723xx
  mcu_name_hints:
    - super8
    - h723
  transports:
    - can
build:
  firmware: klipper
  architecture: stm32
  processor: STM32H723
  clock_reference: 25MHz crystal
  bootloader_offset: 128KiB
  communication: usb_to_canbus_bridge
  usb_pins: PA11/PA12
  can_rx_pin: PB8
  can_tx_pin: PB9
  can_bitrate: "{{ can_bitrate }}"
  gpio_pins_on_startup: ""
  documented_bitrate: "1000000"
bootloader:
  firmware: katapult
  type: katapult
  architecture: stm32
  processor: STM32H723
  clock_reference: 25MHz crystal
  application_start_offset: 128KiB
  communication: usb
  usb_pins: PA11/PA12
  support_bootloader_entry: true
initial_flash:
  method: sdcard
  bootloader: katapult
  artifact: "~/katapult/out/katapult.bin"
  output_name: firmware.bin
  physical_steps:
    - Copy katapult.bin to SD card as firmware.bin.
    - Insert SD card and reboot the board.
    - Wait until firmware.bin is renamed by the bootloader.
update:
  method: can_bridge_usb_katapult
  stop_klipper: true
  enter_bootloader: "python3 ~/katapult/scripts/flashtool.py -i {{ can_interface }} -r -u {{ canbus_uuid }}"
  wait_usb_katapult: true
  flash_usb: "python3 ~/katapult/scripts/flashtool.py -f {{ artifact }} -d {{ katapult_serial }}"
  verify_can_uuid: true
  start_klipper: true
flash:
  method: usb_katapult_or_make_flash
notes:
  can_bridge: Katapult is reached over USB after requesting bootloader over CAN; final Klipper firmware is USB-CAN bridge.
