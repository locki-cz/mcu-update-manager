id: btt_ebb36_gen2_can
name: BigTreeTech EBB36 Gen2
vendor: BigTreeTech
family: toolhead
source:
  - https://canbus.esoterical.online/toolhead_flashing/common_hardware/BigTreeTech%20EBB36%20Gen2/README.html
  - https://bttwiki.com/en/EBB36_GEN2.html
source_images:
  katapult_config: https://github.com/user-attachments/assets/f1df3f71-13cb-4e01-b82f-26f9565e8aab
  klipper_config: https://github.com/user-attachments/assets/fe7c7584-4c79-4e3a-a950-1cc4322ba55e
match:
  chips:
    - stm32g0b1xx
  mcu_name_hints:
    - ebb
    - toolhead
  transports:
    - can
fingerprint:
  printer_cfg_pins:
    strong:
      - PB14
      - PA8
      - PB6
      - PB4
      - PA3
      - PD3
build:
  firmware: klipper
  architecture: stm32
  processor: STM32G0B1
  clock_reference: 8MHz crystal
  bootloader_offset: 8KiB
  communication: canbus
  can_rx_pin: PB12
  can_tx_pin: PB13
  can_bitrate: "{{ can_bitrate }}"
  gpio_pins_on_startup: ""
  kconfig_overrides:
    - CONFIG_STM32_CANBUS_PB12_PB13=y
    - CONFIG_CANSERIAL=y
    - CONFIG_CANBUS=y
    - CONFIG_CANBUS_FILTER=y
bootloader:
  firmware: katapult
  type: katapult
  architecture: stm32
  processor: STM32G0B1
  clock_reference: 8MHz crystal
  application_start_offset: 8KiB
  communication: canbus
  can_rx_pin: PB12
  can_tx_pin: PB13
  can_bitrate: "{{ can_bitrate }}"
  support_double_click_reset: true
  status_led: true
  status_led_pin: PA2
initial_flash:
  method: dfu_util
  bootloader: katapult
  dfu_vid_pid: "0483:df11"
  artifact: "~/katapult/out/katapult.bin"
  command: "dfu-util -a 0 -D ~/katapult/out/katapult.bin -s 0x08000000:leave"
  physical_steps:
    - Power off printer.
    - Remove USB/CAN selection jumper.
    - Connect USB to the breakout board USB-C port.
    - Hold BOOT, press and release RST, wait 5 seconds, release BOOT.
    - Reinstall USB/CAN selection jumper after DFU flashing.
update:
  method: can_katapult
  stop_klipper: true
  enter_bootloader: "python3 ~/katapult/scripts/flashtool.py -i {{ can_interface }} -r -u {{ canbus_uuid }}"
  flash: "python3 ~/katapult/scripts/flashtool.py -i {{ can_interface }} -f {{ artifact }} -u {{ canbus_uuid }}"
  start_klipper: true
flash:
  method: can_katapult
notes:
  dfu_vid_pid: "0483:df11"
  can_mode: Install USB/CAN jumper.
  dfu_mode: Remove USB/CAN jumper, connect USB through breakout board, hold BOOT, press/release RST, wait 5 seconds, release BOOT.
